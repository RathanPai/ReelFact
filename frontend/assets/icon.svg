<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="#0d0f17" />
  <rect width="512" height="512" rx="128" fill="url(#grad)" opacity="0.15" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#grad)" stroke-width="4" opacity="0.4" />
  
  <!-- Shield Badge -->
  <path d="M256 90 L390 140 C390 270 256 390 256 420 C256 390 122 270 122 140 Z" fill="url(#grad)" />
  <path d="M256 90 L390 140 C390 270 256 390 256 420 C256 390 122 270 122 140 Z" fill="url(#glow)" />
  
  <!-- Checkmark Icon inside Shield -->
  <path d="M210 260 L242 292 L306 218" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Video / Reel Film Strip Play Dots -->
  <circle cx="256" cy="340" r="10" fill="#ffffff" opacity="0.9" />
</svg>
